name: 🎮 Bug with Owyx launcher
description: Bugs in the Owyx desktop launcher (this fork — not Modrinth App).
labels: [app]
type: 'bug'
body:
  - type: markdown
    attributes:
      value: |
        This tracker is for **Owyx** ([ebluffy/Owyx](https://github.com/ebluffy/Owyx)), a rebranded fork of [modrinth/code](https://github.com/modrinth/code).
        Upstream Modrinth App issues belong on the Modrinth repo.
  - type: checkboxes
    attributes:
      label: Please confirm the following.
      options:
        - label: I checked existing issues on this fork for duplicates
          required: true
        - label: I am reporting an Owyx build (not the official Modrinth App)
          required: true
        - label: My Owyx installation is up to date (or I note the commit/tag)
          required: true
  - type: input
    id: version
    attributes:
      label: What version / commit of Owyx are you using?
      description: Settings → about, or `git rev-parse --short HEAD` if building from source
    validations:
      required: true
  - type: dropdown
    id: oses
    attributes:
      label: Operating system
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What happened? What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste relevant logs if you have them
    validations:
      required: false

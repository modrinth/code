name: 💡 Feature request
description: Suggest an idea for Owyx
type: 'feature'

body:
  - type: markdown
    attributes:
      value: |
        This tracker is for **Owyx** ([ebluffy/Owyx](https://github.com/ebluffy/Owyx)), a fork/rebrand of [modrinth/code](https://github.com/modrinth/code).
  - type: checkboxes
    attributes:
      label: Please confirm the following.
      options:
        - label: I checked existing issues on this fork for duplicates
          required: true
  - type: dropdown
    id: projects
    attributes:
      label: What part of Owyx is this about?
      multiple: true
      options:
        - Owyx launcher
        - owyxsite (control plane)
        - Docs / packaging
    validations:
      required: true
  - type: textarea
    attributes:
      label: Problem
      description: What is frustrating today?
    validations:
      required: false
  - type: textarea
    attributes:
      label: Proposed solution
    validations:
      required: true

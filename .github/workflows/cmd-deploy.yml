name: Deploy Command
run-name: Deploy PR #${{ github.event.client_payload.github.payload.issue.number || github.event.pull_request.number }}

on:
  repository_dispatch:
    types: [deploy-command]
  pull_request:
    types: [closed]

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.pull_request.head.repo.full_name == github.repository }}
    uses: SparkUniverse/workflows/.github/workflows/deploy-command.yaml@main
    secrets:
      ARGOCD_DEPLOY_KEY: ${{ secrets.ARGOCD_DEPLOY_KEY }}
      CMD_DISPATCH_GH_TOKEN: ${{ secrets.SLASH_CMD_GH_TOKEN }}
    with:
      application-set: labrinth
      applications: ${{ contains(github.event.client_payload.slash_command.args.all, '--force') && '--force' || '' }}
      build-workflow: labrinth-build.yml
      branch: ${{ github.event.client_payload.pull_request.head.ref }}
      issue-number: ${{ github.event.client_payload.github.payload.issue.number }}
      head-sha: ${{ github.event.client_payload.pull_request.head.sha }}
      pin: true

  release:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    uses: SparkUniverse/workflows/.github/workflows/argo-update.yaml@main
    secrets:
      ARGOCD_DEPLOY_KEY: ${{ secrets.ARGOCD_DEPLOY_KEY }}
    with:
      application-set: labrinth
      release-pin: ${{ github.event.pull_request.head.ref }}

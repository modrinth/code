name: Frontend Docker

on:
  push:
    branches:
      - main
      - prod
    paths:
      - 'apps/frontend/**/*'
      - 'packages/ui/**/*'
      - 'packages/utils/**/*'
      - 'packages/assets/**/*'
      - 'packages/moderation/**/*'
      - 'packages/api-client/**/*'
      - 'packages/blog/**/*'
      - '**/pnpm-*.yaml'
      - .github/workflows/frontend-docker.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/prod' }}

env:
  TURBO_TELEMETRY_DISABLED: 1
  pnpm_config_color: always

jobs:
  build:
    name: Build frontend
    runs-on: namespace-profile-modrinth-frontend
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9.0.1

      - name: Configure environment
        id: meta
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" = "refs/heads/main" ]; then
            echo "env=staging" >> $GITHUB_OUTPUT
          else
            echo "env=production" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Set up caches
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          cache: |
            pnpm

      - name: Set up Turborepo caching
        uses: namespace-actions/setup-turbocache@a94b84c111f2cc781a4a83c4d07a99f2c63e33d6 # v0.0.3

      - name: Inject build variables
        working-directory: ./apps/frontend
        run: |
          if [ "${{ steps.meta.outputs.env }}" == "staging" ]; then
            echo "Injecting staging variables from wrangler.jsonc..."
            jq -r '.env.staging.vars | to_entries[] | "\(.key)=\(.value)"' wrangler.jsonc >> $GITHUB_ENV
          else
            echo "Injecting production variables from wrangler.jsonc..."
            jq -r '.vars | to_entries[] | "\(.key)=\(.value)"' wrangler.jsonc >> $GITHUB_ENV
          fi

      - name: Install dependencies
        working-directory: ./apps/frontend
        run: pnpm install

      - name: Build frontend
        run: pnpm web:build
        env:
          NITRO_PRESET: node_cluster
          BUILD_ENV: ${{ steps.meta.outputs.env }}
          CF_PAGES_BRANCH: ${{ github.ref_name }}
          CF_PAGES_COMMIT_SHA: ${{ github.sha }}

      # Runs before staging so the injected debug IDs end up in the image
      - name: Create Sentry release and upload sourcemaps
        uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3.7.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: modrinth
          SENTRY_PROJECT: frontend-server
        with:
          release: ${{ github.sha }}
          environment: ${{ steps.meta.outputs.env }}
          sourcemaps: ./apps/frontend/.output/server
          url_prefix: '~/'
          set_commits: skip

      - name: Stage Docker context
        run: |
          mkdir -p apps/frontend/docker-stage
          cp -r apps/frontend/.output apps/frontend/docker-stage/.output

      - name: Upload Docker context
        uses: namespace-actions/upload-artifact@f6ccaacc655aec41b93af180d1d7eef21af862d2 # v1.0.3
        with:
          name: frontend-docker-context
          retention-days: 1
          path: apps/frontend/docker-stage

  docker-build:
    needs: [build]
    uses: SparkUniverse/workflows/.github/workflows/docker-build.yaml@main
    with:
      image-name: frontend
      dockerfile-path: apps/frontend/Dockerfile
      artifacts-name: frontend-docker-context

  deploy:
    name: Roll out to Magic Containers
    needs: [docker-build]
    if: ${{ github.ref == 'refs/heads/prod' && github.event_name == 'push' }}
    runs-on: namespace-profile-tiny-arm64
    permissions:
      contents: read
    steps:
      - name: Update container image
        uses: BunnyWay/actions/container-update-image@4b22fe0b319386b3913117daf97729409dd0a6ef # main
        with:
          api_key: ${{ secrets.BUNNY_API_KEY }}
          app_id: ${{ vars.BUNNY_FRONTEND_APP_ID }}
          container: app
          image_tag: gh${{ github.run_id }}

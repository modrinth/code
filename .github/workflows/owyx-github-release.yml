# Build Owyx installers and publish a GitHub Release (with updater artifacts).
name: Owyx GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver without v prefix (e.g. 0.2.0)'
        required: true
        default: '0.2.0'

permissions:
  contents: write

concurrency:
  group: owyx-github-release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows NSIS
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"; V="${V#v}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "version=$V"

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Set Cargo package version
        shell: bash
        env:
          V: ${{ steps.ver.outputs.version }}
        run: node scripts/set-app-version.js "$V"

      - name: Prepare app-lib compile-time env (prod API hosts)
        shell: bash
        run: cp packages/app-lib/.env.prod packages/app-lib/.env

      - name: Build app frontend (release)
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          VITE_OWYX_CLIENT_KEY: ${{ secrets.OWYX_CLIENT_KEY }}
          VITE_OWYX_API_BASE_URL: https://api.owyx.site
        run: pnpm turbo run build --filter=@modrinth/app-frontend

      - name: Build NSIS installer + updater
        shell: bash
        working-directory: apps/app
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          VITE_OWYX_CLIENT_KEY: ${{ secrets.OWYX_CLIENT_KEY }}
          VITE_OWYX_API_BASE_URL: https://api.owyx.site
          OWYX_DISCORD_APP_ID: ${{ secrets.OWYX_DISCORD_APP_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm exec tauri build --config tauri-owyx-release.conf.json --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: owyx-windows-nsis
          path: |
            target/release/bundle/nsis/*
            apps/app/target/release/bundle/nsis/*
          if-no-files-found: error

  build-linux:
    name: Linux AppImage
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"; V="${V#v}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Install WebKit deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set Cargo package version
        env:
          V: ${{ steps.ver.outputs.version }}
        run: node scripts/set-app-version.js "$V"

      - name: Prepare app-lib compile-time env (prod API hosts)
        run: cp packages/app-lib/.env.prod packages/app-lib/.env

      - name: Build app frontend (release)
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          VITE_OWYX_CLIENT_KEY: ${{ secrets.OWYX_CLIENT_KEY }}
          VITE_OWYX_API_BASE_URL: https://api.owyx.site
        run: pnpm turbo run build --filter=@modrinth/app-frontend

      - name: Build AppImage + updater
        working-directory: apps/app
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          VITE_OWYX_CLIENT_KEY: ${{ secrets.OWYX_CLIENT_KEY }}
          VITE_OWYX_API_BASE_URL: https://api.owyx.site
          OWYX_DISCORD_APP_ID: ${{ secrets.OWYX_DISCORD_APP_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm exec tauri build --config tauri-owyx-release.conf.json --bundles appimage

      - uses: actions/upload-artifact@v4
        with:
          name: owyx-linux-appimage
          path: |
            target/release/bundle/appimage/*
            apps/app/target/release/bundle/appimage/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"; V="${V#v}"; TAG="v$V"
          else
            TAG="${GITHUB_REF_NAME}"; V="${TAG#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create tag + release + latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          NOTES=$(cat <<EOF
          ## Owyx™ ${VERSION}

          ### Changes
          - Accounts: user-facing play paths are **Owyx site** + **Microsoft** only (no offline-nick UI); site session badge when signed in
          - Social: Friends stats, presence chip from real heartbeat, Open Friends closes settings modal; incoming pending only
          - Site: launcher-first DESIGN (no one-server / plugin pitch); hero API/DB status; download from GitHub Releases; RU/EN form placeholders
          - Cleanup: Hosting pages removed (catch-all → Owyx Servers); plugin/game-token/applications APIs return **410**; no game IP in public settings
          - Brand: Onest + Unbounded, cyan accent; dead Pride banner / Medal hosting prefetch gone

          Installers: Windows NSIS, Linux AppImage. GPL-3 fork of [modrinth/code](https://github.com/modrinth/code); not affiliated with Modrinth / Rinth, Inc. Owyx™ branding reserved — see TRADEMARK.md.
          EOF
          )
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git fetch --tags origin
            if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
              git tag -a "$TAG" -m "Owyx $VERSION"
              git push origin "refs/tags/$TAG"
            fi
          fi

          mapfile -t FILES < <(find dist -type f \( -name '*.exe' -o -name '*.AppImage' -o -name '*.sig' -o -name '*.zip' \) | sort)
          echo "Files:"; printf '%s\n' "${FILES[@]}"
          test "${#FILES[@]}" -gt 0

          WIN_URL=""; WIN_SIG=""; LINUX_URL=""; LINUX_SIG=""
          while IFS= read -r -d '' sigf; do
            art="${sigf%.sig}"
            [[ -f "$art" ]] || continue
            b=$(basename "$art")
            case "$b" in
              *.nsis.zip|*-setup.exe)
                WIN_URL="https://github.com/ebluffy/Owyx/releases/download/${TAG}/${b}"
                WIN_SIG=$(cat "$sigf")
                ;;
              *.AppImage)
                LINUX_URL="https://github.com/ebluffy/Owyx/releases/download/${TAG}/${b}"
                LINUX_SIG=$(cat "$sigf")
                ;;
            esac
          done < <(find dist -type f -name '*.sig' -print0)

          export WIN_URL WIN_SIG LINUX_URL LINUX_SIG VERSION PUB_DATE
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          export PUB_DATE
          python3 - <<'PY' > latest.json
          import json, os, sys
          platforms = {}
          win_url, win_sig = os.environ.get("WIN_URL",""), os.environ.get("WIN_SIG","")
          lin_url, lin_sig = os.environ.get("LINUX_URL",""), os.environ.get("LINUX_SIG","")
          if win_url and win_sig:
              platforms["windows-x86_64"] = {"url": win_url, "signature": win_sig.strip()}
          if lin_url and lin_sig:
              platforms["linux-x86_64"] = {"url": lin_url, "signature": lin_sig.strip()}
          if not platforms:
              print("WARNING: no signed updater artifacts; publishing installers only", file=sys.stderr)
          print(json.dumps({
              "version": os.environ["VERSION"],
              "notes": f"Owyx {os.environ['VERSION']}",
              "pub_date": os.environ.get("PUB_DATE",""),
              "platforms": platforms,
          }, indent=2))
          PY
          echo "latest.json:"; cat latest.json
          if [[ -s latest.json ]] && grep -q '"platforms"' latest.json; then
            FILES+=("$(pwd)/latest.json")
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" "${FILES[@]}" --title "Owyx ${VERSION}" --notes "$NOTES"
          fi

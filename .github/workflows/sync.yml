name: Sync with Upstream

on:
  schedule:
    - cron: '30 12 * * *' # finishes daily at about 14:00 my timezone, about perfect for me
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Pull upstream changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/modrinth/app.git
          git fetch upstream
          if ! git merge --no-edit upstream/main; then
            if [ -n "$(git ls-files --unmerged)" ]; then
              echo "::error::Merge conflicts detected during upstream sync! Manual intervention required."
            else
              echo "::error::Upstream merge failed without unresolved conflicts."
            fi
            exit 1
          fi

      - name: Push to your fork
        run: git push origin main

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

jobs:
  typos:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: namespace-profile-untrusted-tiny-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: crate-ci/typos@4c8b7f51ca60df14e3c5ca82770dfbbe6c3dae85 # v1.52.0

  # see <https://github.com/influxdata/datafusion-udf-wasm/pull/275>
  tombi:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: namespace-profile-untrusted-tiny-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: tombi@1.4.1
      - run: tombi lint
      - run: tombi fmt --check

name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/prod' }}

env:
  INTERNAL: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  build:
    name: Lint and Test
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'namespace-profile-modrinth-turbo' || 'ubuntu-latest' }}

    env:
      # Ensure pnpm output is colored in GitHub Actions logs
      FORCE_COLOR: 3
      # Make cargo nextest successfully ignore projects without tests
      NEXTEST_NO_TESTS: pass
      # Fail on warnings in CI
      # (but don't do this in the root `Cargo.toml`,
      # since we don't want warnings to become errors
      # while developing)
      RUSTFLAGS: -Dwarnings
      # Redis config for tests
      REDIS_TOPOLOGY: cluster
      REDIS_CONNECTION_TYPE: multiplexed
      REDIS_URL: redis://127.0.0.1:7000,redis://127.0.0.1:7001,redis://127.0.0.1:7002,redis://127.0.0.1:7003,redis://127.0.0.1:7004,redis://127.0.0.1:7005
      # Avoid stack overflows in tests
      RUST_MIN_STACK: 134217728
      # Namespace's sccache backend is only available to internal runs
      SCCACHE_CACHE_SIZE: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '20G' || '' }}
      RUSTC_WRAPPER: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'sccache' || '' }}

    steps:
      - name: Check out code
        if: env.INTERNAL != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Check out code (Namespace)
        if: env.INTERNAL == 'true'
        uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9.0.1
        with:
          fetch-depth: 2

      - name: Setup Node and caches
        uses: ./.github/actions/setup
        with:
          namespace: ${{ env.INTERNAL }}
          cache: |
            rust
            pnpm
            apt

      - name: Install apt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libcurl4-openssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rustflags: ''
          components: clippy, rustfmt
          cache: false

      # External contributors run on GitHub runners without the Namespace cache volume.
      # Pushes to main save their Rust build to GitHub's cache (only when dependencies
      # change, without restoring it over the Namespace cache) so those runs start warm.
      # RUSTC_WRAPPER is left out of the key since only Namespace runs use sccache.
      - name: Set up GitHub Rust cache
        if: env.INTERNAL != 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          env-vars: CARGO CC CFLAGS CXX CMAKE RUSTFLAGS RUST_
          lookup-only: ${{ env.INTERNAL == 'true' }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Setup mold
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1 / Mold 2.41.0

      - name: Setup sccache
        if: env.INTERNAL == 'true'
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Configure sccache
        if: env.INTERNAL == 'true'
        run: nsc cache sccache setup --cache_name default >> "$GITHUB_ENV"

      - name: Setup Rust tools
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-nextest@0.9.133,typos@1.48.0,tombi@1.4.1,cargo-shear

      # cargo-binstall does not have pre-built binaries for sqlx-cli, so we fall
      # back to a cached cargo install
      - name: Setup cargo-sqlx
        uses: taiki-e/cache-cargo-install-action@417450f3c33ee20393705369577571770643d4c7 # v3.0.7
        with:
          tool: sqlx-cli@0.8.6
          locked: false
          no-default-features: true
          features: rustls,postgres

      - name: Install dependencies
        run: pnpm install

      - name: Set app environment
        working-directory: packages/app-lib
        run: cp .env.staging .env

      - name: Lint and test
        run: pnpm run ci

      - name: Verify intl:extract has been run
        run: |
          pnpm moon run :intl-extract --force
          pnpm scripts i18n-icu-contract prune-local --check
          git diff --exit-code --color */*/src/locales/*/index.json

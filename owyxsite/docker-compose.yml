# One compose brings up the whole Owyx site: Postgres + Adminer + backend +
# frontend. Directus is optional (profile "directus").
#
#   cp .env.example .env   # set DB_PASSWORD / JWT_SECRET / SESSION_SECRET
#   docker compose up -d --build
#
# Ports: frontend 3000 · backend 3001 · postgres 5432 · adminer 8080 · directus 8055 (profile)

services:
  postgres:
    image: postgres:17-alpine
    container_name: owyx-postgres
    environment:
      - TZ=Europe/Moscow
      - POSTGRES_USER=${DB_USER:-owyx_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME:-owyx_db}
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/migrations/000_bootstrap_roles.sql:/docker-entrypoint-initdb.d/00_bootstrap_roles.sql:ro
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./postgres/migrations/001_chat.sql:/docker-entrypoint-initdb.d/02_chat.sql:ro
      - ./postgres/migrations/002_roles.sql:/docker-entrypoint-initdb.d/03_roles.sql:ro
      - ./postgres/migrations/003_cosmetics.sql:/docker-entrypoint-initdb.d/04_cosmetics.sql:ro
      - ./postgres/migrations/004_nickname_cooldown.sql:/docker-entrypoint-initdb.d/05_nickname.sql:ro
      - ./postgres/migrations/005_email_change.sql:/docker-entrypoint-initdb.d/06_email_change.sql:ro
      - ./postgres/migrations/006_news.sql:/docker-entrypoint-initdb.d/07_news.sql:ro
      - ./postgres/migrations/007_servers_packs.sql:/docker-entrypoint-initdb.d/08_servers_packs.sql:ro
      - ./postgres/migrations/008_nickname_max_16.sql:/docker-entrypoint-initdb.d/09_nickname_max_16.sql:ro
      - ./postgres/migrations/009_nickname_varchar_16.sql:/docker-entrypoint-initdb.d/10_nickname_varchar_16.sql:ro
      - ./postgres/migrations/010_display_nickname.sql:/docker-entrypoint-initdb.d/11_display_nickname.sql:ro
      - ./postgres/migrations/011_display_nickname_nonunique.sql:/docker-entrypoint-initdb.d/12_display_nickname_nonunique.sql:ro
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-owyx_user} -d ${DB_NAME:-owyx_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Browser DB admin for debugging (http://localhost:8080, server: postgres).
  adminer:
    image: adminer:4
    container_name: owyx-adminer
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
      - ADMINER_DESIGN=dracula
    ports:
      - "${ADMINER_BIND:-127.0.0.1}:${ADMINER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  directus:
    image: directus/directus:11
    container_name: owyx-directus
    profiles: ["directus"]
    environment:
      - TZ=Europe/Moscow
      - KEY=${DIRECTUS_KEY}
      - SECRET=${DIRECTUS_SECRET}
      - DB_CLIENT=pg
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_NAME:-owyx_db}
      - DB_USER=${DB_USER:-owyx_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:8055}
      - WEBSOCKETS_ENABLED=true
      - CORS_ENABLED=true
      - CORS_ORIGIN=${FRONTEND_URL:-http://localhost:3000}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@owyx.site}
      - EMAIL_TRANSPORT=${EMAIL_TRANSPORT:-smtp}
      - EMAIL_SMTP_HOST=${EMAIL_SMTP_HOST:-}
      - EMAIL_SMTP_PORT=${EMAIL_SMTP_PORT:-587}
      - EMAIL_SMTP_USER=${EMAIL_SMTP_USER:-}
      - EMAIL_SMTP_PASSWORD=${EMAIL_SMTP_PASSWORD:-}
      - STORAGE_LOCATIONS=local
      - STORAGE_LOCAL_ROOT=/directus/uploads
      - CACHE_ENABLED=true
      - CACHE_STORE=memory
      - CACHE_TTL=30m
    volumes:
      - ./directus/uploads:/directus/uploads
      - ./directus/extensions:/directus/extensions
    ports:
      - "8055:8055"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8055/server/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: owyx-backend
    environment:
      - TZ=Europe/Moscow
      - NODE_ENV=${NODE_ENV:-production}
      - API_PORT=3001
      - PORT=3001
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-owyx_db}
      - DB_USER=${DB_USER:-owyx_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
      - TURNSTILE_SKIP=${TURNSTILE_SKIP:-false}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - EMAIL_SMTP_HOST=${EMAIL_SMTP_HOST:-}
      - EMAIL_SMTP_PORT=${EMAIL_SMTP_PORT:-587}
      - EMAIL_SMTP_USER=${EMAIL_SMTP_USER:-}
      - EMAIL_SMTP_PASSWORD=${EMAIL_SMTP_PASSWORD:-}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@owyx.site}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID:-}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET:-}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:3000}
      - TRUST_PROXY_HOPS=${TRUST_PROXY_HOPS:-0}
      - LAUNCHER_CLIENT_KEY=${LAUNCHER_CLIENT_KEY:-}
      - API_HOSTS=${API_HOSTS:-api.owyx.site}
      - API_PUBLIC_URL=${API_PUBLIC_URL:-}
      - API_URL=${API_URL:-}
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/fixtures:/app/fixtures:ro
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
        - NEXT_PUBLIC_DIRECTUS_URL=${NEXT_PUBLIC_DIRECTUS_URL:-http://localhost:8055}
        - NEXT_PUBLIC_SOCKET_URL=${NEXT_PUBLIC_SOCKET_URL:-http://localhost:3001}
        - NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        - BACKEND_URL=http://backend:3001
    container_name: owyx-frontend
    environment:
      - TZ=Europe/Moscow
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - BACKEND_URL=http://backend:3001
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
      - NEXT_PUBLIC_DIRECTUS_URL=${NEXT_PUBLIC_DIRECTUS_URL:-http://localhost:8055}
      - NEXT_PUBLIC_SOCKET_URL=${NEXT_PUBLIC_SOCKET_URL:-http://localhost:3001}
      - NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    ports:
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3

# ---------------------------------------------------------------------------
# Production note (GMKtec / host networking):
# If you prefer host mode like the original plan, set network_mode: host on
# each service, point Directus DB_HOST=127.0.0.1, backend DB_HOST=127.0.0.1,
# remove ports: mappings, and put Nginx in front (see nginx-conf/owyx.conf).
# ---------------------------------------------------------------------------

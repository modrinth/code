# Host nginx for Owyx control-plane (separate VPS from panel.owyx.site).
#
# DNS on this VPS:
#   owyx.site / www.owyx.site  — public website (Next)
#   api.owyx.site              — launcher API only (Express + uploads)
#
# panel.owyx.site stays on the VPN box — NEVER add it here.
#
# After certbot:
#   sudo ln -sf /opt/owyx/owyxsite/deploy/nginx-owyx.site.conf /etc/nginx/sites-enabled/owyx-site.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Upstream ports = FRONTEND_PORT / API_PORT in owyxsite/.env (defaults 3000 / 3001).

upstream owyx_frontend {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream owyx_backend {
    server 127.0.0.1:3001;
    keepalive 16;
}

# ---- HTTP (certbot + redirect) --------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name owyx.site www.owyx.site api.owyx.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS: website -------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name owyx.site www.owyx.site;

    ssl_certificate     /etc/letsencrypt/live/owyx.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/owyx.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2048M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Browser same-origin API (no X-Owyx-Client-Key; Host stays owyx.site)
    location /api/ {
        proxy_pass http://owyx_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
    }

    location = /api {
        proxy_pass http://owyx_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /uploads/ {
        proxy_pass http://owyx_backend;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /socket.io/ {
        proxy_pass http://owyx_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 86400;
    }

    location / {
        proxy_pass http://owyx_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
    }
}

# ---- HTTPS: launcher API host (requires X-Owyx-Client-Key) ----------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.owyx.site;

    ssl_certificate     /etc/letsencrypt/live/owyx.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/owyx.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2048M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /health {
        proxy_pass http://owyx_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        proxy_pass http://owyx_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}

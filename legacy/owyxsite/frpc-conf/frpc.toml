# ==============================================
# FRP Client Configuration - OWYX (TOML Format)
# ==============================================
# Fast Reverse Proxy - проброс портов с VPS на локальную машину
#
# Установка на Linux:
# 1. Скачать FRP: https://github.com/fatedier/frp/releases
# 2. Распаковать: tar -xzf frp_*_linux_amd64.tar.gz
# 3. Скопировать: sudo cp frpc /usr/local/bin/
# 4. Создать конфиг: sudo mkdir -p /etc/frp
# 5. Скопировать файл: sudo cp frpc.toml /etc/frp/
# 6. Создать systemd сервис (см. frpc.service)
# 7. Запуск: sudo systemctl start frpc
# 8. Автозагрузка: sudo systemctl enable frpc

# Основные настройки подключения
serverAddr = "212.22.82.250"
serverPort = 7000

# Аутентификация
[auth]
token = "V6H4KcyRZ4V1pm0BDzexcppQB3DmXDLoFk4z9EML6Qt"

# Логирование
[log]
to = "/var/log/frpc.log"
level = "info"
maxDays = 7

# Heartbeat и reconnect
loginFailExit = false
user = "owyx-gmktec-m6"

# ==============================================
# OWYX WEB - HTTP/HTTPS
# ==============================================

# HTTP (порт 80)
[[proxies]]
name = "owyx-web-http"
type = "tcp"
localIP = "127.0.0.1"
localPort = 80
remotePort = 80

# HTTPS (порт 443)
[[proxies]]
name = "owyx-web-https"
type = "tcp"
localIP = "127.0.0.1"
localPort = 443
remotePort = 443

# ==============================================
# OWYX SERVICES - Directus, Next.js, Socket.io
# ==============================================

# Directus API (порт 8055) - опционально, если нужен прямой доступ
[[proxies]]
name = "owyx-directus"

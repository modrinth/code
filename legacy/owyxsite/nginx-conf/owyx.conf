# ==============================================
# Discord Invite Redirect - discord.owyx.site
# ==============================================
server {
    listen 80;
    server_name discord.owyx.site;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name discord.owyx.site;

    ssl_certificate /etc/letsencrypt/live/discord.owyx.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/discord.owyx.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Редирект на Discord приглашение
    # Обновите ссылку на вашу реальную ссылку приглашения
    return 301 https://discord.gg/YOUR_INVITE_CODE;

    access_log /var/log/nginx/discord_owyx.access.log;
    error_log /var/log/nginx/discord_owyx.error.log;
}

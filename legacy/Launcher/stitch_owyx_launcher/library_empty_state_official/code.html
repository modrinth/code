<span class="material-symbols-outlined text-[24px] group-hover:text-primary-fixed-dim transition-colors" data-icon="home">home</span>
</div>
<!-- Library (Active) -->

</div>
<div class="w-8 h-px bg-border my-2"></div>

</div>

</div>

</div>

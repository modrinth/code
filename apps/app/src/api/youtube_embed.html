<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<style>
			html,
			body {
				margin: 0;
				height: 100%;
				background: #000;
			}

			iframe {
				display: block;

				border: 0;

			src="{{src}}"

			allowfullscreen
		></iframe>
	</body>
</html>

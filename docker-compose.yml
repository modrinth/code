name: labrinth
services:
  postgres_db:
    # staging/prod Labrinth are currently using this version of Postgres
    image: postgres:15-alpine
    container_name: labrinth-postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: labrinth
      POSTGRES_PASSWORD: labrinth
      POSTGRES_HOST_AUTH_METHOD: trust
      PGUSER: labrinth
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'labrinth']
      interval: 3s
      timeout: 5s
      retries: 3
  postgres_minecraft_meta:
    image: postgres:15-alpine
    container_name: labrinth-postgres-minecraft-meta
    volumes:
      - db-launcher-meta-data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5433:5432'
    environment:
      POSTGRES_USER: launchermeta
      POSTGRES_PASSWORD: launchermeta
      POSTGRES_HOST_AUTH_METHOD: trust
      PGUSER: launchermeta
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'launchermeta']
      interval: 3s
      timeout: 5s
      retries: 3
  minecraft-meta-s3:
    image: docker.io/rustfs/rustfs:1.0.1
    container_name: labrinth-minecraft-meta-s3
    user: '0:0'
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_ACCESS_KEY: minecraftmeta
      RUSTFS_SECRET_KEY: minecraftmeta-local
      RUSTFS_OBS_LOG_DIRECTORY: /data/logs
    volumes:
      - minecraft-meta-s3-data:/data
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://localhost:9000/health']
      interval: 3s
      timeout: 5s
      retries: 10
  minecraft-meta-s3-init:
    profiles:
      - minecraft-meta-init
    image: docker.io/amazon/aws-cli:2.34.0
    container_name: labrinth-minecraft-meta-s3-init
    environment:
      AWS_ACCESS_KEY_ID: minecraftmeta
      AWS_SECRET_ACCESS_KEY: minecraftmeta-local
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://minecraft-meta-s3:9000
      AWS_PAGER: ''
    depends_on:
      minecraft-meta-s3:
        condition: service_healthy
    entrypoint: ['sh', '-ec']
    command:
      - |
        aws s3api head-bucket --bucket minecraft-meta-public || aws s3api create-bucket --bucket minecraft-meta-public
        aws s3api head-bucket --bucket minecraft-meta-private || aws s3api create-bucket --bucket minecraft-meta-private
        aws s3api put-bucket-policy --bucket minecraft-meta-public --policy '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":"s3:GetObject","Resource":"arn:aws:s3:::minecraft-meta-public/*"}]}'
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.4
    container_name: labrinth-elasticsearch
    restart: on-failure
    ports:
      - '127.0.0.1:9200:9200'
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: 'true'
      xpack.security.enabled: 'false'
      xpack.security.enrollment.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test:
        ['CMD-SHELL', 'curl --fail http://localhost:9200/_cluster/health?wait_for_status=yellow']
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:alpine
    container_name: labrinth-redis
    restart: on-failure
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'PING']
      interval: 3s
      timeout: 5s
      retries: 3
  redis-cluster-0:
    profiles:
      - clustered-redis
    image: redis:alpine
    container_name: labrinth-redis-cluster-0
    restart: on-failure
    networks:
      - redis-cluster-mesh
    ports:
      - '127.0.0.1:7000:7000'
    command:
      [
        'redis-server',
        '--port',
        '7000',
        '--cluster-enabled',
        'yes',
        '--cluster-config-file',
        'nodes.conf',
        '--cluster-node-timeout',
        '5000',
        '--appendonly',
        'no',
        '--save',
        '',
      ]
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD', 'redis-cli', '-p', '7000', 'PING']
      interval: 3s
      timeout: 5s
      retries: 10
  redis-cluster-1:
    profiles:
      - clustered-redis
    image: redis:alpine
    container_name: labrinth-redis-cluster-1
    restart: on-failure
    networks:
      - redis-cluster-mesh
    ports:
      - '127.0.0.1:7001:7001'
    command:
      [
        'redis-server',
        '--port',
        '7001',
        '--cluster-enabled',
        'yes',
        '--cluster-config-file',
        'nodes.conf',
        '--cluster-node-timeout',
        '5000',
        '--appendonly',
        'no',
        '--save',
        '',
      ]
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD', 'redis-cli', '-p', '7001', 'PING']
      interval: 3s
      timeout: 5s
      retries: 10
  redis-cluster-2:
    profiles:
      - clustered-redis
    image: redis:alpine
    container_name: labrinth-redis-cluster-2
    restart: on-failure
    networks:
      - redis-cluster-mesh
    ports:
      - '127.0.0.1:7002:7002'
    command:
      [
        'redis-server',
        '--port',
        '7002',
        '--cluster-enabled',
        'yes',
        '--cluster-config-file',
        'nodes.conf',
        '--cluster-node-timeout',
        '5000',
        '--appendonly',
        'no',
        '--save',
        '',
      ]
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD', 'redis-cli', '-p', '7002', 'PING']
      interval: 3s
      timeout: 5s
      retries: 10
  redis-cluster-3:
    profiles:
      - clustered-redis
    image: redis:alpine
    container_name: labrinth-redis-cluster-3
    restart: on-failure
    networks:
      - redis-cluster-mesh
    ports:
      - '127.0.0.1:7003:7003'
    command:
      [
        'redis-server',
        '--port',
        '7003',
        '--cluster-enabled',
        'yes',
        '--cluster-config-file',
        'nodes.conf',
        '--cluster-node-timeout',
        '5000',
        '--appendonly',
        'no',
        '--save',
        '',
      ]
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD', 'redis-cli', '-p', '7003', 'PING']
      interval: 3s
      timeout: 5s
      retries: 10
  redis-cluster-4:
    profiles:
      - clustered-redis
    image: redis:alpine
    container_name: labrinth-redis-cluster-4
    restart: on-failure
    networks:
      - redis-cluster-mesh
    ports:
      - '127.0.0.1:7004:7004'
    command:
      [
        'redis-server',
        '--port',
        '7004',
        '--cluster-enabled',
        'yes',
        '--cluster-config-file',
        'nodes.conf',
        '--cluster-node-timeout',
        '5000',
        '--appendonly',
        'no',
        '--save',
        '',
      ]
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD', 'redis-cli', '-p', '7004', 'PING']
      interval: 3s
      timeout: 5s
      retries: 10
  redis-cluster-5:
    profiles:
      - clustered-redis
    image: redis:alpine
    container_name: labrinth-redis-cluster-5
    restart: on-failure
    networks:
      - redis-cluster-mesh
    ports:
      - '127.0.0.1:7005:7005'
    command:
      [
        'redis-server',
        '--port',
        '7005',
        '--cluster-enabled',
        'yes',
        '--cluster-config-file',
        'nodes.conf',
        '--cluster-node-timeout',
        '5000',
        '--appendonly',
        'no',
        '--save',
        '',
      ]
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD', 'redis-cli', '-p', '7005', 'PING']
      interval: 3s
      timeout: 5s
      retries: 10
  redis-cluster-creator:
    profiles:
      - clustered-redis
    image: redis:alpine
    container_name: labrinth-redis-cluster-creator
    networks:
      - redis-cluster-mesh
    depends_on:
      redis-cluster-0:
        condition: service_healthy
      redis-cluster-1:
        condition: service_healthy
      redis-cluster-2:
        condition: service_healthy
      redis-cluster-3:
        condition: service_healthy
      redis-cluster-4:
        condition: service_healthy
      redis-cluster-5:
        condition: service_healthy
    entrypoint: ['sh', '-c']
    command:
      - |
        cluster_info="$$(redis-cli -h redis-cluster-0 -p 7000 cluster info 2>/dev/null || true)"
        case "$$cluster_info" in
          *"cluster_state:ok"*) exit 0 ;;
        esac
        exec redis-cli --cluster create \
          redis-cluster-0:7000 \
          redis-cluster-1:7001 \
          redis-cluster-2:7002 \
          redis-cluster-3:7003 \
          redis-cluster-4:7004 \
          redis-cluster-5:7005 \
          --cluster-replicas 1 \
          --cluster-yes
  redis-insight:
    profiles:
      - clustered-redis
    image: redis/redisinsight:latest
    container_name: labrinth-redis-insight
    restart: on-failure
    networks:
      - redis-cluster-mesh
    depends_on:
      redis-cluster-creator:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:5540:5540'
    volumes:
      - redis-insight-data:/data
  clickhouse:
    image: clickhouse/clickhouse-server
    container_name: labrinth-clickhouse
    ports:
      - '127.0.0.1:8123:8123'
    environment:
      CLICKHOUSE_DB: staging_ariadne
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: default
    healthcheck:
      test: ['CMD-SHELL', 'clickhouse-client --query "SELECT 1"']
      interval: 3s
      timeout: 5s
      start_period: 60s
      retries: 3
  mail:
    image: axllent/mailpit:v1.27
    container_name: labrinth-mail
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    environment:
      MP_ENABLE_SPAMASSASSIN: postmark
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O/dev/null', 'http://localhost:8025/api/v1/info']
      interval: 3s
      timeout: 5s
      retries: 3
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: labrinth-gotenberg
    ports:
      - '127.0.0.1:13000:3000'
    extra_hosts:
      # Gotenberg must send a message on a webhook to our backend,
      # so it must have access to our local network
      - 'host.docker.internal:host-gateway'
  redpanda:
    image: redpandadata/redpanda:v26.1.10
    container_name: labrinth-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    ports:
      - '127.0.0.1:18081:18081'
      - '127.0.0.1:18082:18082'
      - '127.0.0.1:19092:19092'
      - '127.0.0.1:19644:9644'
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ['CMD', 'rpk', 'cluster', 'info', '-X', 'brokers=localhost:9092']
      interval: 10s
      timeout: 15s
      retries: 10
  delphi:
    profiles:
      - with-delphi
    image: ghcr.io/modrinth/delphi:main
    container_name: labrinth-delphi
    ports:
      - '127.0.0.1:59999:59999'
    environment:
      LABRINTH_ENDPOINT: http://host.docker.internal:8000/_internal/delphi/ingest
      LABRINTH_ADMIN_KEY: feedbeef
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O/dev/null', 'http://localhost:59999/health']
      interval: 3s
      timeout: 5s
      retries: 3
    volumes:
      # Labrinth deposits version files here;
      # Delphi reads them from here
      - /tmp/modrinth:/tmp/modrinth:ro,z
    extra_hosts:
      # Delphi must send a message on a webhook to our backend,
      # so it must have access to our local network
      - 'host.docker.internal:host-gateway'
networks:
  default:
    driver: bridge
  redis-cluster-mesh:
    driver: bridge
volumes:
  elasticsearch-data:
  db-data:
  db-launcher-meta-data:
  minecraft-meta-s3-data:
  redis-data:
  redis-insight-data:
  redpanda-data:

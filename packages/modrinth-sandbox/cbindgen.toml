language = "C"
include_guard = "MODRINTH_SANDBOX_H"
pragma_once = true
cpp_compat = true
usize_is_size_t = true
documentation = true
autogen_warning = "/* Generated by cbindgen. Do not edit manually. */"

[parse]
parse_deps = false

[export]
item_types = ["constants", "structs", "opaque", "functions", "typedefs"]
exclude = ["sandbox_init_with_parameters", "sandbox_free_error", "JVM_ARGUMENTS"]

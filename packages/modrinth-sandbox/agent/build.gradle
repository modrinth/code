buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath("com.gradleup.shadow:com.gradleup.shadow.gradle.plugin:9.2.2")
    }
}

plugins {
    id "java"
    id "com.gradleup.shadow" version "9.2.2"
}

group = "com.modrinth"
version = "1.0.0"

repositories {
    mavenCentral()
}

dependencies {
    shadow(implementation("org.ow2.asm:asm:9.10.1"))
    shadow(implementation("org.ow2.asm:asm-tree:9.10.1"))
    shadow(implementation("com.google.code.gson:gson:2.14.0"))
    compileOnly("org.lwjgl:lwjgl-sdl:3.4.3")
    compileOnly("org.lwjgl:lwjgl-nfd:3.4.3")
}

shadowJar {
    archiveFileName = "SandboxAgent.jar"
    manifest {
        attributes["Premain-Class"] = "com.modrinth.sandboxagent.SandboxAgent"
        attributes["Can-Retransform-Classes"] = "true"
    }
    configurations = [project.configurations.shadow]
    relocate("org.objectweb.asm", "com.modrinth.sandboxagent.org.objectweb.asm")
    relocate("com.google", "com.modrinth.sandboxagent.com.google")
}

java {
    toolchain.languageVersion.set(JavaLanguageVersion.of(17))
}

tasks.withType(JavaCompile).configureEach {
    options.release = 8
}

tasks.jar {
    enabled = false
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

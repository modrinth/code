buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath("com.gradleup.shadow:com.gradleup.shadow.gradle.plugin:8.3.0")
    }
}

plugins {
    id "java"
    id "com.gradleup.shadow" version "8.3.0"
}

group = "com.modrinth"
version = "1.0.0"

base {
    archivesName.set("SandboxAgent")
}

repositories {
    mavenCentral()
}

dependencies {
    shadow(implementation("org.ow2.asm:asm:9.10.1"))
    shadow(implementation("org.ow2.asm:asm-tree:9.10.1"))
    shadow(implementation("com.google.code.gson:gson:2.14.0"))
    compileOnly("org.lwjgl:lwjgl-sdl:3.4.3")
}

shadowJar {
    configurations = [project.configurations.shadow]
    relocate("org.objectweb.asm", "com.modrinth.sandboxagent.org.objectweb.asm")
    relocate("com.google", "com.modrinth.sandboxagent.com.google")
}

java {
    toolchain.languageVersion.set(JavaLanguageVersion.of(8))
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.jar {
    dependsOn(shadowJar)
    manifest {
        attributes["Premain-Class"] = "com.modrinth.sandboxagent.SandboxAgent"
    }
}
